<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search - Premium Puzzle Game</title>
    <meta name="description" content="A gorgeous, interactive word search puzzle game with space-neon aesthetics, dynamic animations, and sound effects.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <!-- Floating particle background -->
    <div class="bg-particles" id="bgParticles"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">✨</span>
                <h1 class="app-title">WORD<span>SEARCH</span></h1>
            </div>
            
            <div class="header-controls">
                <div class="control-group">
                    <label for="difficultySelect" class="sr-only">Difficulty</label>
                    <select id="difficultySelect" class="custom-select">
                        <option value="easy">Easy (8x8)</option>
                        <option value="medium" selected>Medium (12x12)</option>
                        <option value="hard">Hard (15x15)</option>
                    </select>
                </div>
                
                <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <!-- Light theme icon (sun) -->
                    <svg class="sun-icon" viewBox="0 0 24 24" width="24" height="24">
                        <circle cx="12" cy="12" r="5" fill="currentColor"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <!-- Dark theme icon (moon) -->
                    <svg class="moon-icon" viewBox="0 0 24 24" width="24" height="24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
                    </svg>
                </button>

                <button id="soundToggle" class="icon-btn" title="Mute/Unmute" aria-label="Toggle Sound">
                    <!-- Sound On icon -->
                    <svg class="sound-on-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <!-- Sound Off icon -->
                    <svg class="sound-off-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>

                <button id="restartBtn" class="primary-btn shrink-on-click">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                    </svg>
                    <span>New Game</span>
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar glass-panel">
            <div class="stat-card">
                <span class="stat-label">Category</span>
                <span id="activeCategoryName" class="stat-value">Space</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card">
                <span class="stat-label">Progress</span>
                <span id="progressText" class="stat-value">0 / 0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card">
                <span class="stat-label">Time</span>
                <span id="timerText" class="stat-value">00:00</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card">
                <span class="stat-label">Score</span>
                <span id="scoreText" class="stat-value">000</span>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-layout">
            <!-- Sidebar: Categories & Word list -->
            <aside class="sidebar-panel glass-panel">
                <!-- Category Select Pills -->
                <div class="panel-section">
                    <h2 class="section-title">Select Theme</h2>
                    <div class="category-pills" id="categoryContainer">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Word Checklist -->
                <div class="panel-section list-section">
                    <div class="section-header">
                        <h2 class="section-title">Words to Find</h2>
                        <span class="badge" id="wordsCountBadge">0 left</span>
                    </div>
                    <div class="words-checklist" id="wordsChecklist">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </aside>

            <!-- Board Container -->
            <section class="board-panel glass-panel">
                <div class="board-relative-wrapper">
                    <!-- Word Grid canvas/SVG/Div container -->
                    <div id="wordGrid" class="word-grid" data-difficulty="medium">
                        <!-- Grid cells filled by JS -->
                    </div>
                    <!-- SVG overlay for drawing the dragging line -->
                    <svg id="dragOverlay" class="drag-overlay"></svg>
                </div>

                <!-- Action Controls below Grid -->
                <div class="board-footer-actions">
                    <button id="hintBtn" class="secondary-btn shrink-on-click" title="Get a letter hint (-50 points)">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                            <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
                        </svg>
                        <span>Reveal Hint</span>
                        <span class="hint-count-badge" id="hintsBadge">💡 3</span>
                    </button>
                    <button id="pauseBtn" class="secondary-btn shrink-on-click" title="Pause the game">
                        <!-- Pause Icon -->
                        <svg class="pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                        <!-- Play Icon -->
                        <svg class="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span id="pauseBtnText">Pause</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Celebration Screen Overlay for Confetti Canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <!-- Win Modal -->
    <div id="winModal" class="modal-overlay">
        <div class="modal-content glass-panel animated-modal">
            <div class="modal-badge">🏆</div>
            <h2 class="modal-title">Level Completed!</h2>
            <p class="modal-subtitle">Superb! You solved the grid and cleared all terms.</p>
            
            <div class="modal-stats">
                <div class="m-stat">
                    <span class="m-stat-label">Category</span>
                    <span id="modalCategory" class="m-stat-value">Space</span>
                </div>
                <div class="m-stat">
                    <span class="m-stat-label">Difficulty</span>
                    <span id="modalDifficulty" class="m-stat-value">Medium</span>
                </div>
                <div class="m-stat">
                    <span class="m-stat-label">Time Taken</span>
                    <span id="modalTime" class="m-stat-value">01:45</span>
                </div>
                <div class="m-stat">
                    <span class="m-stat-label">Final Score</span>
                    <span id="modalScore" class="m-stat-value">650</span>
                </div>
            </div>
            
            <div class="modal-actions">
                <button id="modalRestartBtn" class="primary-btn shrink-on-click">
                    <span>Play Another Theme</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="modal-overlay">
        <div class="modal-content glass-panel animated-modal pause-modal">
            <div class="modal-badge">⏳</div>
            <h2 class="modal-title">Game Paused</h2>
            <p class="modal-subtitle">Take a breather, the cosmos will wait.</p>
            <div class="modal-actions">
                <button id="resumeBtn" class="primary-btn shrink-on-click">
                    <span>Resume Game</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JS Files -->
    <script src="script.js"></script>
</body>
</html>
